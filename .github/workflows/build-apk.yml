name: Build FreshCart Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/FreshCart-v1.0.apk
          echo "APK generated successfully at build-artifacts/FreshCart-v1.0.apk"
          ls -lh build-artifacts/FreshCart-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreshCart-APK
          path: build-artifacts/FreshCart-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 build-artifacts/FreshCart-v1.0.apk \
            --title "FreshCart v1.0.0 — Production Ready APK" \
            --notes "FreshCart Grocery Buying App for Android. Built via GitHub Actions CI/CD." \
            --target main || echo "Release creation attempted"
