name: Build FreshCart Android APK

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/FreshCart-v1.0.apk
          echo "APK generated successfully at build-artifacts/FreshCart-v1.0.apk"
          ls -lh build-artifacts/FreshCart-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreshCart-APK
          path: build-artifacts/FreshCart-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.2 build-artifacts/FreshCart-v1.0.apk \
            --title "FreshCart v1.0.2 — High Contrast & WCAG AA Edition" \
            --notes "FreshCart Grocery Buying App with full WCAG AA contrast compliance, light-mode enforcement, and Indian Rupee (₹) currency support." \
            --target main || gh release upload v1.0.2 build-artifacts/FreshCart-v1.0.apk --clobber
